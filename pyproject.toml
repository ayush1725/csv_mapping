[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "header-resolver"
version = "0.1.0"
description = "Tiered schema matching — auto-maps partner CSV upload headers to a canonical schema"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
